name: Deploy to Devnet

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Target network"
        required: true
        default: "devnet"
        type: choice
        options:
          - devnet
          - mainnet-beta

env:
  CARGO_TERM_COLOR: always
  SOLANA_VERSION: "1.18.17"
  ANCHOR_VERSION: "0.30.1"
  PROGRAM_ID: "8rptyeuewV5niejZieWhjS4Uc8hXJp5FMbpDrk3RyUZt"

jobs:
  deploy:
    name: Deploy Program
    runs-on: ubuntu-latest
    environment: ${{ inputs.network }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable (for AVM)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: deploy-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            deploy-cargo-${{ runner.os }}-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI via AVM
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --force --locked
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}
          echo "$HOME/.avm/bin" >> $GITHUB_PATH

      - name: Install Rust 1.75 for Solana BPF compatibility
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0

      - name: Install pinned nightly for Anchor IDL generation
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2024-04-18

      - name: Configure Solana
        run: |
          solana config set --url ${{ inputs.network }}
          echo "${{ secrets.SOLANA_PRIVATE_KEY }}" > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json
          mkdir -p target/deploy
          echo "${{ secrets.SOLANA_PROGRAM_KEYPAIR }}" > target/deploy/bichocoin_program-keypair.json
          chmod 600 target/deploy/bichocoin_program-keypair.json
          test "$(solana-keygen pubkey target/deploy/bichocoin_program-keypair.json)" = "${{ env.PROGRAM_ID }}"
          solana address

      - name: Airdrop SOL (devnet only)
        if: inputs.network == 'devnet'
        run: |
          solana airdrop 2 --url devnet || true

      - name: Build program
        run: anchor build
        env:
          RUSTUP_TOOLCHAIN: nightly-2024-04-18

      - name: Deploy program
        run: |
          anchor deploy --provider.cluster ${{ inputs.network }}
          echo "Program deployed!"
          solana program show "${{ env.PROGRAM_ID }}" --url ${{ inputs.network }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-${{ inputs.network }}
          path: |
            target/deploy/*.so
            target/idl/*.json
            target/types/*.ts
