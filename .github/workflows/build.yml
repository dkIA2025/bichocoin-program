name: Build Anchor Program

on:
  push:
    branches: [main]
    paths:
      - "programs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Anchor.toml"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SOLANA_VERSION: "1.18.17"
  ANCHOR_VERSION: "0.30.1"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (1.75 for BPF compatibility)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0

      - name: Install Rust stable (for AVM)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI via AVM
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --force --locked
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}
          echo "$HOME/.avm/bin" >> $GITHUB_PATH

      - name: Generate Solana keypair
        run: |
          solana-keygen new --no-bip39-passphrase --force -o ~/.config/solana/id.json

      - name: Pin crates for BPF compatibility
        run: |
          rm -f Cargo.lock
          cargo +1.75.0 generate-lockfile
          cargo +1.75.0 update -p blake3 --precise 1.5.0
          cargo +1.75.0 update -p borsh@1.8 --precise 1.4.0
          cargo +1.75.0 update -p serde_json --precise 1.0.128
          cargo +1.75.0 update -p serde_bytes --precise 0.11.15
          cargo +1.75.0 update -p serde --precise 1.0.210
          cargo +1.75.0 update -p serde_derive --precise 1.0.210
          cargo +1.75.0 update -p proc-macro-crate@3 --precise 3.2.0
          cargo +1.75.0 update -p indexmap --precise 2.7.0
          cargo +1.75.0 update -p unicode-segmentation --precise 1.12.0
          cargo +1.75.0 update -p jobserver --precise 0.1.32
          cargo +1.75.0 update -p syn@2 --precise 2.0.79
          cargo +1.75.0 update -p proc-macro2 --precise 1.0.89
          cargo +1.75.0 update -p quote --precise 1.0.37
          cargo +1.75.0 update -p unicode-ident --precise 1.0.12
          cargo +1.75.0 update -p libc --precise 0.2.155
          cargo +1.75.0 update -p thiserror --precise 1.0.63

      - name: Build program
        run: anchor build

      - name: Run tests
        run: anchor test
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anchor-program
          path: |
            target/deploy/*.so
            target/idl/*.json
            target/types/*.ts
          retention-days: 7
