[package]
name = "bichocoin-program"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bichocoin_program"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]


[dependencies]
anchor-lang = "0.30.1"

# Solana 1.18's BPF toolchain uses Rust 1.75. Keep the optional WebAssembly
# dependency family on the last release line that supports that compiler.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.69"
wasm-bindgen = "=0.2.92"
web-sys = "=0.3.69"
